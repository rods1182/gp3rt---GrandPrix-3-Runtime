; GP3RT for Linux - settings / configuracoes
; Easiest way: open GP3RT-Configurador.html in your browser.
; Mais facil: abra o GP3RT-Configurador.html no navegador.

[video]
; fullscreen = desktop resolution / tela cheia na resolucao da area de trabalho
; window = window / janela   (Alt+Enter switches in game / alterna no jogo)
mode=fullscreen
; window size in multiples of 640x480 / tamanho da janela em multiplos de 640x480
window_scale=1
; graphics card / placa de video: auto (dedicated if there are two / dedicada
; se houver duas), dedicated, integrated, system (don't touch / nao mexe)
gpu=auto
; 3D internal resolution / resolucao interna do 3D:
; auto (4x dedicated / dedicada, 2x integrated / integrada), 1, 2, 3, 4
internal_scale=auto
; 1 = smooth textures / suavizar texturas
force_filtering=1
; anisotropic filtering / filtragem anisotropica: auto, 0, 2, 4, 8, 16
anisotropy=auto
; 1 = V-Sync (recommended / recomendado)
vsync=1
; water spray and smoke opacity / opacidade do spray e da fumaca, %
; (100 = GP3 original)
spray_opacity=60

; --- Widescreen ---
; The 1280x1024 option of the game's graphics menu becomes this resolution.
; A opcao 1280x1024 do menu de graficos do jogo vira esta resolucao.
; -1 = desktop / area de trabalho; 0 = off / desligado; or / ou 1920 / 1080
wide_width=-1
wide_height=-1
; 1 = Hor+ field of view (more picture at the sides, no stretching)
;     campo de visao Hor+ (mais imagem dos lados, sem esticar)
hor_plus=1
; field of view / campo de visao, % (100 = default / padrao, 110 = wider / mais aberto)
fov_percent=100

[game]
; numeric keypad / teclado numerico: 0 = follows NumLock / segue o NumLock;
; 1 = always navigation keys / sempre teclas de navegacao (cockpit cameras /
; cameras de bordo); 2 = always numbers / sempre numeros
numpad_keys=0
; 1 = skip GP3's internal checks, as GPxPatch does (community tracks beyond
;     the original limits) / ignora as verificacoes internas do GP3, como o
;     GPxPatch faz (pistas da comunidade alem dos limites originais)
skip_asserts=1
; 1 = load GPxPatch when installed (GPxPSup.dll + gpxpdata) / carrega o
;     GPxPatch quando instalado; 0 = plain game / jogo puro
gpxpatch=1
; 1 = 3D sound like on Windows / som 3D como no Windows (GP3 2000, GPxSound)
sound3d=1
; 1 = intro movies (Esc skips) / videos de abertura (Esc pula)
intro_videos=1

; --- Replay ---
; 1 = whole-race replay: loads GP3Replay.dll if it is in the game folder (GP3 1.13)
;     replay da corrida inteira: carrega o GP3Replay.dll se estiver na pasta
gp3replay=1
; 1 = GP3 2000 replay keys on GP3 1.13 (F1..F9) / teclas do replay do GP3 2000
;     Shift+F1 = start of the race / largada; Shift+F2 = where it stopped / fim
replay_keys=1
; 1 = show the F1..F9 legend in the replay / mostra a legenda F1..F9 no replay
replay_legend=1
; 1 = spray and smoke after rewinding the replay (GP3 1.13)
;     spray e fumaca depois de voltar o replay
replay_fx_fix=1
; 1 = GP3 2000: replay up to 2 hours (the game stops at 1h30)
;     GP3 2000: replay de ate 2 horas (o jogo para em 1h30)
replay_2h=1
