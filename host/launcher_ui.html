<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPxPatch</title>
<style>
:root{
  --bg:#15171a; --panel:#1d2024; --panel2:#24282d; --line:#33383f; --text:#e7e9ec; --muted:#9aa1ab;
  --accent:#e8432f; --accent2:#ff6a4d; --ok:#3fb950; --warn:#e3b341; --field:#111316; --focus:#5aa0ff;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef0f3; --panel:#ffffff; --panel2:#f5f6f8; --line:#d5d9df; --text:#1b1e22; --muted:#5d6570;
    --field:#ffffff; --accent:#d4351f; --accent2:#e8432f;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Ubuntu,Cantarell,"Noto Sans",sans-serif}
header{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{font-weight:800;font-size:19px;letter-spacing:.2px}
.logo b{color:var(--accent)}
.meta{color:var(--muted);font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{display:flex;min-height:calc(100vh - 128px)}
nav{width:190px;flex:none;border-right:1px solid var(--line);padding:10px 8px;background:var(--panel)}
nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--text);padding:9px 12px;border-radius:7px;font:inherit;cursor:pointer;margin-bottom:2px}
nav button:hover{background:var(--panel2)}
nav button.on{background:var(--accent);color:#fff;font-weight:600}
nav .sep{height:1px;background:var(--line);margin:8px 6px}
main{flex:1;min-width:0;padding:18px 22px 30px;max-width:980px}
h2{margin:0 0 4px;font-size:20px}
.sub{color:var(--muted);margin:0 0 16px;font-size:13px}
.group{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px 6px;margin-bottom:14px}
.group h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
.row{display:flex;align-items:center;gap:12px;padding:7px 0;border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.group h3 + .row{border-top:0}
.row label.l{flex:1;min-width:0}
.row .hint{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.row .c{flex:none;display:flex;align-items:center;gap:6px}
input[type=text],input[type=number],select{background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;min-width:0}
input[type=number]{width:96px}
input.wide,select.wide{width:330px;max-width:52vw}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.unit{color:var(--muted);font-size:12.5px}
/* switch */
.sw{position:relative;width:42px;height:24px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:12px;transition:.15s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.sw input:checked + span{background:var(--accent)}
.sw input:checked + span:before{transform:translateX(18px)}
.sw input:focus-visible + span{outline:2px solid var(--focus)}
footer{position:sticky;bottom:0;display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--panel);border-top:1px solid var(--line);flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 16px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2)}
.btn:disabled{opacity:.5;cursor:default}
.btn.small{padding:5px 10px;font-weight:500;font-size:13px}
#status{color:var(--muted);font-size:13px;margin-left:auto}
#saved{font-size:12.5px;color:var(--ok);opacity:0;transition:opacity .3s}
#saved.show{opacity:1}
.notice{background:color-mix(in srgb,var(--warn) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13.5px}
table.k{width:100%;border-collapse:collapse}
table.k td{padding:5px 6px;border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
table.k td.act{color:var(--muted);font-size:12px;font-family:ui-monospace,monospace}
.keybtn{min-width:96px;font-family:ui-monospace,monospace;font-weight:600}
.keybtn.wait{background:var(--accent);color:#fff;border-color:var(--accent)}
.keybtn.dup{border-color:var(--warn);color:var(--warn)}
.slot{display:grid;grid-template-columns:36px 150px 1fr;gap:10px;align-items:center;padding:6px 0;border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.slot .n{color:var(--muted);font-family:ui-monospace,monospace}
.slot select{width:100%}
.fontcard{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:10px;background:var(--panel2)}
.fontcard .head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.fontcard .head b{font-family:ui-monospace,monospace}
.empty{color:var(--muted);padding:6px 0}
.slot{grid-template-columns:36px 150px 1fr auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(720px,100%);max-height:86vh;display:flex;flex-direction:column}
.modal .top{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.modal .path{font-family:ui-monospace,monospace;font-size:12.5px;color:var(--muted);flex:1;min-width:0;overflow-wrap:anywhere}
.modal .list{overflow:auto;padding:6px 8px}
.modal .it{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);font:inherit;padding:7px 10px;border-radius:6px;cursor:pointer}
.modal .it:hover{background:var(--panel2)}
.modal .it.dat{font-weight:600}
.modal .bot{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}
@media (max-width:760px){
  .wrap{flex-direction:column}
  nav{width:auto;display:flex;flex-wrap:wrap;gap:4px;border-right:0;border-bottom:1px solid var(--line)}
  nav button{width:auto}
  nav .sep{display:none}
  main{padding:14px 16px}
  .row{flex-wrap:wrap}
  input.wide,select.wide{width:100%;max-width:none}
  .slot{grid-template-columns:30px 1fr auto}
  .slot select{grid-column:1/-1;grid-row:2}
}
.lang{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;margin-left:auto}
.lang select{padding:4px 6px}
.filepick{display:flex;gap:6px;align-items:center}
.filepick input{width:300px;max-width:42vw}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:color-mix(in srgb,var(--accent) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:10px;padding:10px 14px;margin-bottom:14px}
.banner span{flex:1;min-width:220px}
.setbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:760px){ .filepick{flex-wrap:wrap} .filepick input{width:100%;max-width:none} }
/* season / car set editors (GP3 2000) */
table.grid{width:100%;border-collapse:collapse;table-layout:fixed}
table.grid th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:4px 6px}
table.grid td{padding:4px 6px;border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent);vertical-align:middle}
table.grid td.t{width:190px}
table.grid td.t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.grid td.t span{display:block;color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jampick{display:flex;gap:4px;align-items:center;min-width:0}
.jampick input{flex:1;min-width:0;width:100%;font-size:12.5px;padding:5px 6px}
.jampick .btn{padding:4px 8px;flex:none}
input.missing{border-color:var(--warn);color:var(--warn)}
.filepick input.missing{border-color:var(--warn)}
.pts{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px 10px;padding:6px 0 10px}
.pts label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.pts input{width:56px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:4px 0 8px}
.tools .hint{color:var(--muted);font-size:12px}
@media (max-width:760px){ table.grid td.t{width:110px} }
</style>
</head>
<body>
<header>
  <div class="logo">GPx<b>Patch</b> <span id="for">para Linux</span></div>
  <div class="meta" id="meta">…</div>
  <div class="lang"><label for="lang" id="langl">Idioma</label><select id="lang"><option value="pt">Português</option><option value="en">English</option></select></div>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<footer>
  <button class="btn primary" id="go" title="Ctrl+S"></button>
  <button class="btn" id="go0"></button>
  <span id="saved"></span>
  <span id="status"></span>
</footer>
<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const DEL = "\x7f";
let S = null, INI = {}, running = false, LANG = "pt";

/* ---------- language ---------- */
function L(pt, ...a){
  let s = (LANG == "en" && EN[pt] !== undefined) ? EN[pt] : pt;
  return a.length ? s.replace(/\{(\d)\}/g, (m, i) => a[+i]) : s;
}

/* ---------- ini ---------- */
function parseIni(text){
  const o = {}; let cur = null;
  if (text == null) return o;
  for (const raw of text.split(/\r?\n/)){
    const s = raw.trim();
    if (!s || s[0]==";" || s[0]=="#") continue;
    if (s[0]=="[" && s.indexOf("=") > 0 && s.indexOf("=") < s.indexOf("]")) continue;   // "[Jam01=...]": a disabled entry
    if (s[0]=="["){ const e = s.indexOf("]"); if (e>0){ const n = s.slice(1,e); cur = o[n.toLowerCase()] || (o[n.toLowerCase()] = {name:n, keys:{}}); } continue; }
    const eq = s.indexOf("="); if (eq<0 || !cur) continue;
    const k = s.slice(0,eq).trim(); cur.keys[k.toLowerCase()] = {k, v:s.slice(eq+1).trim()};
  }
  return o;
}
function get(f, s, k, d){
  const sec = INI[f] && INI[f][s.toLowerCase()]; const e = sec && sec.keys[k.toLowerCase()];
  return e ? e.v : (d === undefined ? "" : String(d));
}
function has(f, s, k){ const sec = INI[f] && INI[f][s.toLowerCase()]; return !!(sec && sec.keys[k.toLowerCase()]); }
function setLocal(f, s, k, v){
  const F = INI[f] || (INI[f] = {}); const sec = F[s.toLowerCase()] || (F[s.toLowerCase()] = {name:s, keys:{}});
  if (v === DEL) delete sec.keys[k.toLowerCase()]; else sec.keys[k.toLowerCase()] = {k, v:String(v)};
}

/* ---------- saving ---------- */
let queue = [], timer = null;
function put(f, s, k, v){
  v = String(v); setLocal(f, s, k, v);
  queue = queue.filter(q => !(q[0]==f && q[1].toLowerCase()==s.toLowerCase() && q[2].toLowerCase()==k.toLowerCase()));
  queue.push([f, s, k, v]);
  clearTimeout(timer); timer = setTimeout(flush, 250);
}
async function flush(){
  clearTimeout(timer); if (!queue.length) return true;
  const body = queue.map(q => q.map(x => String(x).replace(/[\t\r\n]/g," ")).join("\t")).join("\n"); queue = [];
  try{
    const j = await (await api("/api/save", body)).json();
    const e = document.getElementById("saved");
    if (j.failed){ e.textContent = "⚠ " + L("{0} valor(es) não salvos", j.failed); e.style.color = "var(--warn)"; }
    else { e.textContent = "✓ " + L("salvo"); e.style.color = ""; }
    e.classList.add("show"); setTimeout(()=>e.classList.remove("show"), 1400);
    return !j.failed;
  }catch(e){ status(L("Sem conexão com o GP3RT: feche esta aba e abra de novo pelo atalho.")); return false; }
}
function api(path, body){ return fetch(path, {method: body===undefined ? "GET" : "POST", headers:{"X-Token":TOKEN}, body}); }
function status(t){ document.getElementById("status").textContent = t; }

/* ---------- widgets ---------- */
const el = (t, a={}, ...kids) => { const e = document.createElement(t); for (const [k,v] of Object.entries(a)){ if (k=="class") e.className=v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v!==undefined && v!==null) e.setAttribute(k, v); } for (const c of kids) if (c!=null) e.append(c); return e; };
let uid = 0;
function row(label, hint, ...ctl){
  const id = "f" + (++uid);
  const first = ctl[0]; if (first && first.querySelector){ const inp = first.matches("input,select") ? first : first.querySelector("input,select"); if (inp) inp.id = id; }
  return el("div",{class:"row"}, el("label",{class:"l", for:id}, L(label), hint ? el("span",{class:"hint"}, L(hint)) : null), el("div",{class:"c"}, ...ctl));
}
function notice(t){ return el("div",{class:"notice"}, t); }
/* one option = {t:type, f:file, s:section, k:key, d:default, label, hint, ...} */
function widget(o){
  /* A key missing from a GPx .ini means the module's own default, which is often not the one
     the Windows GPxPatch shows (e.g. the GPxSAT [Sky] options are off when missing). Like the
     Windows GUI when it saves, write the value shown here so that what you see is what runs. */
  if (/^gpx[a-z]*\.ini$/i.test(o.f) && o.t != "file" && o.t != "jam" && o.d !== undefined && o.d !== "" && !has(o.f, o.s, o.k))
    put(o.f, o.s, o.k, o.t == "num" && o.float ? fmtFloat(o.d) : o.d);
  const cur = get(o.f, o.s, o.k, o.d);
  if (o.t=="check"){
    const on = (v) => o.inv ? !(+v) : !!(+v);
    const i = el("input",{type:"checkbox"}); i.checked = on(cur);
    i.addEventListener("change", () => { put(o.f, o.s, o.k, (o.inv ? !i.checked : i.checked) ? 1 : 0); if (o.after) o.after(i.checked); });
    return row(o.label, o.hint, el("label",{class:"sw"}, i, el("span")));
  }
  if (o.t=="num"){
    const i = el("input",{type:"number", min:o.min, max:o.max, step:o.step||1}); i.value = parseFloat(cur);
    if (isNaN(parseFloat(cur))) i.value = o.d;
    i.addEventListener("change", () => { let v = i.value===""? o.d : +i.value; if (o.min!=null) v = Math.max(o.min, v); if (o.max!=null) v = Math.min(o.max, v); i.value = v; put(o.f, o.s, o.k, o.float ? fmtFloat(v) : Math.round(v)); });
    return row(o.label, o.hint, i, o.unit ? el("span",{class:"unit"}, L(o.unit)) : null);
  }
  if (o.t=="select" || o.t=="font"){
    let opts = o.opts;
    if (o.t=="font") opts = fontNames().map(n => [n, n]);
    if (typeof opts == "function") opts = opts();
    const s = el("select",{class: o.wide ? "wide" : ""});
    let found = false;
    for (const [v, l] of opts){ const op = el("option",{value:v}, L(l)); if (String(v).toLowerCase()==String(cur).toLowerCase()){ op.selected = true; found = true; } s.append(op); }
    if (!found && cur!==""){ const op = el("option",{value:cur}, cur); op.selected = true; s.prepend(op); }
    s.addEventListener("change", () => { put(o.f, o.s, o.k, s.value); if (o.after) o.after(s.value); });
    return row(o.label, o.hint, s);
  }
  if (o.t=="text"){
    const i = el("input",{type:"text", class:"wide", placeholder:o.ph ? L(o.ph) : ""}); i.value = cur;
    i.addEventListener("change", () => put(o.f, o.s, o.k, i.value.trim()));
    return row(o.label, o.hint, i);
  }
  if (o.t=="file"){   // a file inside the game folder, chosen with the folder browser
    const i = el("input",{type:"text", placeholder:L("nenhum arquivo")}); i.value = cur; i.dataset.alts = cur;
    i.addEventListener("change", () => { put(o.f, o.s, o.k, i.value.trim()); i.dataset.alts = i.value.trim(); checkFiles(); });
    const b = el("button",{class:"btn small"}, L("Procurar…"));
    b.addEventListener("click", () => browse({ext:o.ext, start: cur ? fromGame(cur).replace(/\/[^\/]*$/,"") : (o.startDir ? S.dir + "/" + o.startDir : S.dir), title:o.label}, v => { i.value = v; i.dataset.alts = v; put(o.f, o.s, o.k, v); checkFiles(); }));
    return row(o.label, o.hint, el("div",{class:"filepick"}, i, b));
  }
  if (o.t=="jam") return row(o.label, o.hint, jamBox(o, false));
  if (o.t=="color"){
    const n = parseInt(cur, 16) >>> 0; const a = (n >>> 24) & 255; const rgb = "#" + (n & 0xffffff).toString(16).padStart(6,"0");
    const i = el("input",{type:"color", value:rgb});
    i.addEventListener("change", () => { const v = parseInt(i.value.slice(1),16); put(o.f, o.s, o.k, "0x" + (((a<<24)>>>0) + v).toString(16).padStart(8,"0")); });
    return row(o.label, o.hint, i);
  }
  return null;
}
function fmtFloat(v){ const s = String(+v); return s.includes(".") ? s : s + "."; }
function group(title, items, note){
  const g = el("div",{class:"group"}, el("h3",{}, L(title)));
  if (note) g.append(el("div",{class:"hint", style:"color:var(--muted);font-size:12.5px;margin:-2px 0 6px"}, L(note)));
  for (const it of items){ if (!it) continue; const w = it instanceof Node ? it : widget(it); if (w) g.append(w); }
  return g;
}
function fontNames(){
  const F = INI["fonts.ini"] || {}; const names = Object.values(F).map(s => s.name);
  for (const d of ["courier","din-bold","ATL2004","digital2004","futura","manana"]) if (!names.some(n => n.toLowerCase()==d.toLowerCase())) names.push(d);
  return names;
}
const B = (f,s,k,d,label,hint,extra) => Object.assign({t:"check",f,s,k,d,label,hint}, extra||{});
const N = (f,s,k,d,label,hint,extra) => Object.assign({t:"num",f,s,k,d,label,hint}, extra||{});
const SEL = (f,s,k,d,label,opts,hint,extra) => Object.assign({t:"select",f,s,k,d,label,opts,hint}, extra||{});
const T = (f,s,k,d,label,hint,extra) => Object.assign({t:"text",f,s,k,d,label,hint}, extra||{});
const FILE = (f,s,k,label,ext,hint,startDir) => ({t:"file",f,s,k,d:"",label,ext,hint,startDir});
const FONT = (f,s,k,d,label,hint) => ({t:"font",f,s,k,d,label,hint});
const WAV = (f,s,k,d,label) => SEL(f,s,k,d,label,()=> (S.wavs||[]).map(w => { const n = w.replace(/^snd\\/i,""); return [n, n]; }));
const is2000 = () => S && S.exe == "2000";

/* ---------- paths and the folder browser ---------- */
function toGame(abs){
  const g = S.dir.replace(/\/+$/,"");
  if (abs.toLowerCase().startsWith(g.toLowerCase() + "/")) return abs.slice(g.length + 1).replace(/\//g,"\\");
  return "Z:" + abs.replace(/\//g,"\\");
}
function fromGame(v){
  if (!v) return "";
  if (/^z:/i.test(v)) return v.slice(2).replace(/\\/g,"/");
  return S.dir + "/" + v.replace(/\\/g,"/");
}
async function browse(opt, done){
  const ext = opt.ext || ".dat";
  const m = el("div",{class:"modal"}); const box = el("div",{class:"box"}); m.append(box); document.body.append(m);
  const close = () => { m.remove(); window.removeEventListener("keydown", esc); };
  function esc(e){ if (e.key=="Escape") close(); }
  window.addEventListener("keydown", esc);
  m.addEventListener("click", e => { if (e.target == m) close(); });
  const show = async (path) => {
    const j = await (await api("/api/ls?p=" + encodeURIComponent(path) + "&e=" + encodeURIComponent(ext))).json();
    box.innerHTML = "";
    const up = el("button",{class:"btn small"}, "⬆ " + L("Acima")); up.addEventListener("click", () => show(j.path.replace(/\/[^\/]+$/,"") || "/"));
    const gm = el("button",{class:"btn small"}, L("Pasta do jogo")); gm.addEventListener("click", () => show(j.game));
    const hm = el("button",{class:"btn small"}, L("Pasta pessoal")); hm.addEventListener("click", () => show(j.home));
    box.append(el("div",{class:"top"}, up, gm, hm, el("div",{class:"path"}, (opt.title ? L(opt.title) + " (" + ext.replace(/,/g," ") + ") · " : "") + j.path)));
    const list = el("div",{class:"list"});
    for (const d of j.dirs){ const b = el("button",{class:"it"}, "📁 " + d); b.addEventListener("click", () => show(j.path.replace(/\/$/,"") + "/" + d)); list.append(b); }
    for (const f of j.files){ const b = el("button",{class:"it dat"}, "📄 " + f); if (opt.dir) b.disabled = true; else b.addEventListener("click", () => { close(); done(toGame(j.path.replace(/\/$/,"") + "/" + f)); }); list.append(b); }
    if (!j.dirs.length && !j.files.length) list.append(el("div",{class:"empty", style:"padding:10px"}, L("Pasta vazia.")));
    box.append(list);
    const cancel = el("button",{class:"btn"}, L("Cancelar")); cancel.addEventListener("click", close);
    const bot = el("div",{class:"bot", style:"gap:8px"});
    if (opt.dir){ const use = el("button",{class:"btn primary"}, L("Usar esta pasta")); use.addEventListener("click", () => { close(); done(toGame(j.path), j); }); bot.append(use); }
    bot.append(cancel); box.append(bot);
  };
  await show(opt.start || S.dir);
}

const SLOTS_113 = ["Austrália","Brasil","Argentina","San Marino","Espanha","Mônaco","Canadá","França","Grã-Bretanha","Áustria","Alemanha","Hungria","Bélgica","Itália","Luxemburgo","Japão"];
const SLOTS_2000 = ["Austrália","Brasil","San Marino","Grã-Bretanha","Espanha","Europa","Mônaco","Canadá","França","Áustria","Alemanha","Hungria","Bélgica","Itália","EUA","Japão","Malásia"];
function buildTrack(){
  const F = "gpxtrack.ini";
  const SET = get(F,"TrackManager","TrackSet","tracks.set") || "tracks.set";
  if (!INI[SET]) INI[SET] = parseIni(S.files.trackset_text);
  /* the track sets: one .set file per season / category */
  const sets = (S.sets||[]).slice(); if (!sets.some(s => s.toLowerCase()==SET.toLowerCase())) sets.unshift(SET);
  const sel = el("select",{class:"wide"});
  for (const s of sets){ const o = el("option",{value:s}, s); if (s.toLowerCase()==SET.toLowerCase()) o.selected = true; sel.append(o); }
  sel.addEventListener("change", async () => { put(F,"TrackManager","TrackSet", sel.value); await flush(); await reload(); });
  const neu = el("button",{class:"btn small"}, L("Salvar como novo…"));
  neu.addEventListener("click", async () => {
    let n = prompt(L("Nome do novo conjunto de pistas (ex.: temporada1998):"), ""); if (!n) return;
    n = n.trim().replace(/[\\\/:*?"<>|\t]/g,"").replace(/\.set$/i,""); if (!n) return;
    await flush();
    const j = await (await api("/api/copyset", SET + "\t" + n + ".set")).json();
    if (!j.ok){ status(L("Já existe um conjunto com esse nome.")); return; }
    put(F,"TrackManager","TrackSet", n + ".set"); await flush(); await reload();
    status(L("Conjunto “{0}” criado. As mudanças agora vão para ele.", n + ".set"));
  });
  const setGroup = group("Conjunto de pistas", [row("Conjunto em uso", "Arquivos .set da pasta gpxpdata: um para cada temporada ou categoria.", el("div",{class:"setbar"}, sel, neu))]);

  const names = is2000() ? SLOTS_2000 : SLOTS_113;
  const dats = (S.dats||[]).slice().sort((a,b)=>a.localeCompare(b));
  const slots = el("div");
  function enable(){ if (!has(F,"TrackManager","TrackSet")) put(F,"TrackManager","TrackSet",SET); }
  names.forEach((nm, i) => {
    const key = "f1ct" + String(i+1).padStart(2,"0");
    const cur = get(SET,"TrackFiles",key,"");
    const s = el("select");
    s.append(el("option",{value:""}, L("(pista original)")));
    let found = !cur;
    for (const d of dats){ const o = el("option",{value:d}, d); if (d.toLowerCase()==cur.toLowerCase()){ o.selected = true; found = true; } s.append(o); }
    if (!found){ const o = el("option",{value:cur}, cur); o.selected = true; s.append(o); }
    s.addEventListener("change", () => { put(SET,"TrackFiles",key, s.value || DEL); enable(); });
    const br = el("button",{class:"btn small", title:L("Escolher um .dat em qualquer pasta")}, L("Procurar…"));
    br.addEventListener("click", () => browse({ext:".dat", start: s.value ? fromGame(s.value).replace(/\/[^\/]*$/,"") : S.dir, title:"Pista"}, (v) => {
      if (![...s.options].some(o => o.value == v)) s.append(el("option",{value:v}, v));
      s.value = v; put(SET,"TrackFiles",key, v); enable();
    }));
    slots.append(el("div",{class:"slot"}, el("span",{class:"n"}, String(i+1).padStart(2,"0")), el("span",{}, L(nm)), s, br));
  });
  const warn = [];
  const inis = S.circuit_inis || [];
  if (inis.length == 1) warn.push(notice(L("A pasta circuits tem um único arquivo .ini ({0}). O GPx usa esse .ini para todas as pistas modificadas dessa pasta, e por isso várias etapas aparecem com o mesmo nome. Deixe cada pista da comunidade (.dat, .ini e arquivos dela) numa pasta própria, por exemplo “pistas\\Donington”, e escolha o .dat aqui com “Procurar…”.", inis[0])));
  return [...warn, setGroup,
    group(L("Seleção de pistas ({0})", SET), [slots], "Escolha o arquivo .dat de cada etapa: na lista (os .dat da pasta do jogo) ou com “Procurar…”, em qualquer pasta do computador. O nome e o país vêm do .ini que fica junto do .dat."),
    group("Limites estendidos", [
      SEL(F,"Misc","ExtendTrackLength","0","Comprimento máximo da pista",[["0","8 km (original)"],["1","10 km"],["2","20 km"]],"Use o menor valor que suas pistas precisam."),
      SEL(F,"Misc","ExtendMaxRaceLaps","0","Voltas máximas na corrida",[["0","99 (original)"],["1","125"],["2","253"]]),
    ]),
    group("Menus", [
      B(F,"TrackManager","CatchMenuStrings",1,"Mostrar nos menus o nome, país e recordes das pistas"),
      B(F,"TrackManager","CatchRecords",0,"Capturar recordes","Sobrescreve recordes antigos do mesmo slot."),
    ]),
    is2000() ? group("Temporada", [
      B(F,"TrackManager","IgnoreCarSet",0,"Ignorar as pistas da temporada e dos carsets","Normalmente a pista escolhida num carset (ou o conjunto de pistas da temporada) tem prioridade sobre esta aba."),
    ]) : null,
  ];
}

const natural = (a,b) => a.localeCompare(b, undefined, {numeric:true, sensitivity:"base"});
const JAM = (f,s,k,label,root,ext,hint) => ({t:"jam",f,s,k,label,root,ext:ext||".jam",hint});

const UTF8 = {};               // .set files saved as UTF-8 (GPxPatch on Windows expects Windows-1252)
function utf8Notice(n){
  if (!UTF8[n]) return null;
  const b = el("button",{class:"btn small"}, L("Converter para Latin-1"));
  b.addEventListener("click", async () => {
    await flush();
    const j = await (await api("/api/tolatin1", n)).json();
    if (j.ok){ delete INI[n]; delete UTF8[n]; await preloadSeason(); render(); status(L("{0} convertido para Latin-1.", n)); }
    else status(L("Não foi possível converter {0}.", n));
  });
  return el("div",{class:"notice"}, L("{0} está gravado em UTF-8. No Linux o GP3RT entende os acentos (ç, ã, é) mesmo assim, mas o GPxPatch do Windows só entende Latin-1 (Windows-1252). ", n), b);
}
const PERF = {};               // performance file -> {teams:[{name,d1,d2}]}

function seasonName(){ return get("gpxset.ini","SeasonManager","SeasonSet","season.set") || "season.set"; }
function carsetName(){
  if (CS_EDIT) return CS_EDIT;
  const c = INI[seasonName()] ? get(seasonName(),"CarSets","CarSet","") : "";
  return c || (S.carsets||[])[0] || "";
}
async function ensureFile(n){
  if (!n || INI[n]) return;
  try{ const j = await (await api("/api/file?n=" + encodeURIComponent(n))).json(); INI[n] = parseIni(j.text); if (j.utf8) UTF8[n] = 1; else delete UTF8[n]; }catch(e){ INI[n] = {}; }
}
function parsePerf(t){
  const teams = [];
  for (const [k, sec] of Object.entries(parseIni(t))){
    const m = /^team #(\d+)$/.exec(k); if (!m) continue;
    const d = (key) => { const e = sec.keys[key]; if (!e) return ""; const p = e.v.split(","); return (p[1]||"").trim(); };
    teams[+m[1]] = {name: (sec.keys["name"]||{v:""}).v, d1:d("first driver"), d2:d("second driver")};
  }
  return {teams};
}
async function ensurePerf(path){
  if (!path || PERF[path] !== undefined) return;
  PERF[path] = null;
  try{ const t = await (await api("/api/gametext?p=" + encodeURIComponent(path))).json(); PERF[path] = t ? parsePerf(t) : null; }catch(e){}
}
async function preloadSeason(){
  if (!S || !S.gpx || !is2000()) return;
  await ensureFile(seasonName());
  const cs = carsetName(); await ensureFile(cs);
  if (cs && get(cs,"Performance","Enable","0") != "0") await ensurePerf(get(cs,"Performance","Path",""));
}
function teamInfo(cs, t){
  const P = cs ? PERF[get(cs,"Performance","Path","")] : null; const x = P && P.teams[t];
  const n = String(t+1).padStart(2,"0");
  if (x && x.name) return {name: L("Equipe {0}", n) + " · " + x.name, sub: [x.d1, x.d2].filter(Boolean).join(" / ")};
  return {name: L("Equipe {0}", n), sub: L("{0} no jogo original", TEAMS_2000[t])};
}
function jamBox(o, compact){
  const R = ROOTS[o.root];
  const cur = get(o.f, o.s, o.k, "");
  const i = el("input",{type:"text", placeholder: compact ? "" : L("nenhum arquivo")}); i.value = cur; i.title = cur;
  const mark = v => { i.dataset.alts = v ? R.alts(v).join("|") : ""; i.classList.remove("missing"); };
  mark(cur);
  const commit = v => { i.value = v; i.title = v; put(o.f, o.s, o.k, v === "" ? DEL : v); mark(v); checkFiles(); };
  i.addEventListener("change", () => commit(i.value.trim()));
  const b = el("button",{class:"btn small", title:L("Procurar…")}, compact ? "…" : L("Procurar…"));
  b.addEventListener("click", () => {
    const v = i.value.trim(); const a = v ? R.alts(v) : null;
    const start = a ? fromGame(a[a.length-1]).replace(/\/[^\/]*$/,"") : S.dir + "/" + R.start;
    browse({ext:o.ext, start, title:o.label}, w => {
      if (o.root == "game") return commit(w);
      if (/^z:/i.test(w) || !R.re.test(w)){ status(L("Escolha um arquivo dentro de {0}.", R.where)); return; }
      commit(w.replace(R.re, ""));
    });
  });
  return el("div",{class: compact ? "jampick" : "filepick"}, i, b);
}
/* fill a list of slots with the files of one folder, in natural order (car1, car1a, car2, …) */
function fillButton(slots, root, ext){
  const R = ROOTS[root];
  const b = el("button",{class:"btn small"}, L("Preencher com uma pasta…"));
  b.addEventListener("click", () => browse({ext, dir:true, start: S.dir + "/" + R.start, title:"Pasta"}, async (w, j) => {
    if (/^z:/i.test(w) || !R.re.test(w + "\\")){ status(L("Escolha uma pasta dentro de {0}.", R.where)); return; }
    const rel = (w + "\\").replace(R.re, "");
    const files = j.files.slice().sort(natural);
    if (!files.length){ status(L("Nenhum arquivo {0} nessa pasta.", ext)); return; }
    slots.forEach((sl, n) => { if (files[n]) put(sl.f, sl.s, sl.k, rel + files[n]); });
    status(files.length == slots.length ? L("{0} arquivos atribuídos, em ordem.", files.length)
                                        : L("A pasta tem {0} arquivos para {1} posições: confira a ordem.", files.length, slots.length));
    render();
  }));
  return b;
}
/* team rows x columns of jam pickers */
function jamGrid(cs, sec, cols, keyOf, root){
  const tb = el("table",{class:"grid"});
  const hr = el("tr",{}, el("th",{class:"t"}, ""));
  for (const c of cols) hr.append(el("th",{}, L(c)));
  tb.append(hr);
  const slots = [];
  for (let t = 0; t < 11; t++){
    const ti = teamInfo(cs, t);
    const tr = el("tr",{}, el("td",{class:"t"}, el("b",{title:ti.name}, ti.name), el("span",{title:ti.sub}, ti.sub)));
    cols.forEach((c, n) => { const k = keyOf(t, n); slots.push({f:cs, s:sec, k}); tr.append(el("td",{}, jamBox({f:cs, s:sec, k, label:L(c), root, ext:".jam"}, true))); });
    tb.append(tr);
  }
  return {table: tb, slots};
}
/* select one of the .set files + new / duplicate */
function setPicker(cur, list, onPick, kind){
  const sel = el("select",{class:"wide"});
  const all = list.slice(); if (cur && !all.some(x => x.toLowerCase()==cur.toLowerCase())) all.unshift(cur);
  if (!all.length) sel.append(el("option",{value:""}, L("(nenhum)")));
  for (const n of all){ const o = el("option",{value:n}, n); if (n.toLowerCase()==(cur||"").toLowerCase()) o.selected = true; sel.append(o); }
  sel.addEventListener("change", () => onPick(sel.value));
  const ask = (msg) => { let n = prompt(msg, ""); if (!n) return null; n = n.trim().replace(/[\\\/:*?"<>|\t\[\]=]/g,"").replace(/\.set$/i,""); return n ? n + ".set" : null; };
  const exists = (n) => [...(S.sets||[]), ...(S.seasons||[]), ...(S.carsets||[])].some(x => x.toLowerCase()==n.toLowerCase());
  const neu = el("button",{class:"btn small"}, L("Novo…"));
  neu.addEventListener("click", async () => {
    const n = ask(kind=="season" ? L("Nome da nova temporada (ex.: F1-1998):") : L("Nome do novo carset (ex.: F1-1998-carros):")); if (!n) return;
    if (exists(n)){ status(L("Já existe um arquivo com esse nome.")); return; }
    if (kind=="season"){ put(n,"CarSets","Enable",1); put(n,"CarSets","CarSet", carsetName()); put(n,"CarSets","EnableTrackSpecific",0); }
    else { put(n,"Performance","Enable",0); put(n,"TeamPitOrder","Enable",0); }
    await flush(); onPick(n, true);
  });
  const dup = el("button",{class:"btn small"}, L("Duplicar…"));
  dup.addEventListener("click", async () => {
    if (!cur) return;
    const n = ask(L("Nome da cópia de {0}:", cur)); if (!n) return;
    if (exists(n)){ status(L("Já existe um arquivo com esse nome.")); return; }
    await flush();
    const j = await (await api("/api/copyset", cur + "\t" + n)).json();
    if (!j.ok){ status(L("Não foi possível copiar.")); return; }
    onPick(n, true);
  });
  return el("div",{class:"setbar"}, sel, neu, cur ? dup : null);
}

function keyName(e){
  const c = e.code;
  if (/^Key[A-Z]$/.test(c)) return c.slice(3);
  if (/^Digit\d$/.test(c)) return c.slice(5);
  if (/^F\d+$/.test(c)) return c;
  if (/^Numpad\d$/.test(c)) return "NP_" + c.slice(6);
  const m = {NumpadDivide:"NP_/",NumpadMultiply:"NP_*",NumpadSubtract:"NP_-",NumpadAdd:"NP_+",NumpadDecimal:"NP_.",NumpadEnter:"ENTER",Enter:"ENTER",Tab:"TAB",Insert:"INSERT",Delete:"DELETE",
    Backspace:"BACKSPACE",PageUp:"PAGEUP",PageDown:"PAGEDOWN",Home:"HOME",End:"END",ArrowUp:"UP",ArrowDown:"DOWN",ArrowLeft:"LEFT",ArrowRight:"RIGHT",ShiftLeft:"SHIFT",ShiftRight:"SHIFT",
    ControlLeft:"CTRL",ControlRight:"CTRL",AltLeft:"ALT",AltRight:"ALT",Space:"SPACE",Backquote:"`",Minus:"-",Equal:"=",BracketLeft:"[",BracketRight:"]",Backslash:"\\",IntlBackslash:"\\",
    Semicolon:";",Quote:"'",Comma:",",Period:".",Slash:"/",IntlRo:"/",CapsLock:"CAPSLOCK",NumLock:"NUMLOCK",ScrollLock:"SCROLLLOCK",Pause:"PAUSE"};
  return m[c] || null;
}
function buildKeys(){
  const F = "keys.ini";
  const binds = (INI[F] && INI[F]["binds"]) ? Object.values(INI[F]["binds"].keys) : [];
  if (!binds.length) return [notice(L("gpxpdata/keys.ini ainda não existe: ele é criado na primeira vez que o jogo roda com o GPxPatch. Inicie o jogo uma vez e volte aqui."))];
  const tb = el("table",{class:"k"}); const buttons = [];
  const markDups = () => {
    const count = {}; for (const b of buttons){ const v = b.textContent.toUpperCase(); count[v] = (count[v]||0) + 1; }
    for (const b of buttons) b.classList.toggle("dup", count[b.textContent.toUpperCase()] > 1 && !/^(TAB|BACKSPACE)$/.test(b.textContent));
  };
  for (const {k, v} of binds){
    const b = el("button",{class:"btn small keybtn", title:L("Clique e aperte a nova tecla (Esc cancela)")}, v);
    b.addEventListener("click", () => {
      b.classList.add("wait"); const old = b.textContent; b.textContent = L("aperte…");
      const h = (e) => { e.preventDefault(); e.stopPropagation(); window.removeEventListener("keydown", h, true); b.classList.remove("wait");
        if (e.code == "Escape"){ b.textContent = old; return; }
        const n = keyName(e); if (!n){ b.textContent = old; status(L("Essa tecla não pode ser usada pelo GPx.")); return; }
        b.textContent = n; put(F, "Binds", k, n); markDups(); };
      window.addEventListener("keydown", h, true);
    });
    buttons.push(b);
    tb.append(el("tr",{}, el("td",{}, KEYLABEL[k] ? L(KEYLABEL[k]) : k), el("td",{class:"act"}, k), el("td",{style:"text-align:right"}, b)));
  }
  markDups();
  return [group("Teclas de atalho (gpxpdata/keys.ini)", [tb], "Clique na tecla e aperte a nova. Em amarelo: tecla usada por mais de uma ação. As teclas “Jogo:” e “Controle:” também mudam as teclas do próprio GP3.")];
}

/* ---------- fonts ---------- */
function buildFonts(){
  const F = "fonts.ini"; const secs = INI[F] ? Object.values(INI[F]) : [];
  const ttfs = (S.ttfs||[]).slice();
  const cards = el("div");
  if (!secs.length) cards.append(el("div",{class:"empty"}, L("Nenhuma fonte definida (o GPx usa as padrão).")));
  for (const sec of secs){
    const s = sec.name;
    const c = el("div",{class:"fontcard"}, el("div",{class:"head"}, el("b",{}, s)));
    c.append(widget(T(F,s,"FaceName","","Nome da fonte","Ex.: Courier New, Arial. No Linux é trocada pela equivalente (Liberation).")));
    c.append(widget(SEL(F,s,"FontFile","","Arquivo da fonte",()=>[["","(fonte do sistema)"]].concat(ttfs.map(t=>[t,t])))));
    c.append(widget(N(F,s,"Height",12,"Altura","Em 1024x768.",{min:4,max:96})));
    c.append(widget(SEL(F,s,"Bold","0","Peso",[["0","Normal"],["400","Regular"],["700","Negrito"]])));
    c.append(widget(B(F,s,"Italic",0,"Itálico")));
    c.append(widget(N(F,s,"InterLineSpacing",0,"Espaço entre linhas",null,{min:-20,max:40})));
    cards.append(c);
  }
  const name = el("input",{type:"text", placeholder:L("nome da nova fonte")});
  const add = el("button",{class:"btn small"}, L("Adicionar"));
  add.addEventListener("click", () => { const n = name.value.trim().replace(/[\[\]=\t]/g,""); if (!n) return; put(F, n, "FaceName", "Arial"); put(F, n, "Height", 14); render("fonts"); });
  return [group("Fontes do GPxPatch (gpxpdata/fonts.ini)", [cards, row("Nova fonte", "Depois escolha-a nas abas GPxLap e GPxSAT.", name, add)])];
}

let current = "gpx";
function texts(){
  document.documentElement.lang = LANG == "en" ? "en" : "pt-BR";
  document.title = L("GPxPatch para Linux");
  document.getElementById("for").textContent = L("para Linux");
  document.getElementById("langl").textContent = L("Idioma");

  document.getElementById("go0").textContent = L("Iniciar sem GPxPatch");
  if (S) document.getElementById("meta").textContent = gameName() + "  ·  " + S.dir + "  ·  GP3RT " + S.version;
}
function render(id){
  current = id || current;
  try{ localStorage.setItem("gpx.tab", current); }catch(e){}
  texts();
  const nav = document.getElementById("nav"); nav.innerHTML = "";
  for (const t of TABS){
    if (t.sep){ nav.append(el("div",{class:"sep"})); continue; }
    if (t.only2000 && !is2000()) continue;
    const b = el("button",{class: t.id==current ? "on" : ""}, L(t.name)); b.addEventListener("click", () => render(t.id)); nav.append(b);
  }
  const m = document.getElementById("main"); m.innerHTML = ""; uid = 0;
  let tab = TABS.find(t => t.id==current);
  if (!tab || (tab.only2000 && !is2000())){ current = "gpx"; tab = TABS[0]; }
  m.append(el("h2",{}, L(tab.name)));
  if (!S.gpx && tab.id!="gp3rt"){
    m.append(notice(L("O GPxPatch não está instalado nesta pasta. Baixe o GPxPatch 4.52 em www.sdidit.nl, instale (pelo Wine ou num PC com Windows) e deixe o GPxPSup.dll e a pasta gpxpdata na pasta do jogo (veja o README / LEIAME). Depois abra esta tela de novo.")));
  } else if (S.gpx && !S.gpxsup && tab.id=="gpx"){
    m.append(notice(L("Falta o arquivo GPxPSup.dll na pasta do jogo: sem ele o GPxPatch não carrega.")));
  }
  for (const part of tab.build()) if (part) m.append(part);
  checkFiles();
}
async function reload(){
  const y = window.scrollY;
  const r = await api("/api/state"); S = await r.json();
  INI = {};
  for (const [n, t] of Object.entries(S.files)) if (n != "trackset" && n != "trackset_text") INI[n] = parseIni(t);
  await preloadSeason();
  render(); window.scrollTo(0, y);
}
async function load(){
  const r = await api("/api/state"); S = await r.json();
  INI = {};
  for (const [n, t] of Object.entries(S.files)) if (n != "trackset" && n != "trackset_text") INI[n] = parseIni(t);
  LANG = get("gp3rt.ini","launcher","language","") || ((navigator.language||"pt").toLowerCase().startsWith("pt") ? "pt" : "en");
  if (LANG != "en") LANG = "pt";
  document.getElementById("lang").value = LANG;
  setRunning(S.running);
  try{ const t = localStorage.getItem("gpx.tab"); if (t && TABS.some(x => x.id==t)) current = t; }catch(e){}
  await preloadSeason();
  /* build every GPx tab once, off screen: options missing from the .ini files get the value shown (see widget) */
  if (S.gpx) for (const t of TABS) if (t.build && t.id != "gp3rt" && !(t.only2000 && !is2000())) { try{ t.build(); }catch(e){} }
  render();
}
document.getElementById("lang").addEventListener("change", (e) => { LANG = e.target.value; put("gp3rt.ini","launcher","language",LANG); render(); });
function setRunning(r){
  running = r;
  document.getElementById("go").disabled = r; document.getElementById("go0").disabled = r;
  if (r) status(L("Jogo em execução…"));
}
async function launch(gpx){
  if (is2000() && get("gpxset.ini","CommandLine","SeasonSet","")) put("gpxset.ini","CommandLine","SeasonSet","");
  await flush();
  const j = await (await api("/api/launch", "gpx=" + (gpx?1:0))).json();
  setRunning(j.running);
  if (!j.running) status(L("Não foi possível iniciar o jogo (veja gp3linux-gpxpatch.log)."));
}
document.getElementById("go").addEventListener("click", () => launch(true));
document.getElementById("go0").addEventListener("click", () => launch(false));
window.addEventListener("keydown", (e) => { if (e.ctrlKey && e.key.toLowerCase()=="s"){ e.preventDefault(); if (!running) launch(true); } });
setInterval(async () => {
  try{
    const j = await (await api("/api/status")).json();

}, 3000);
