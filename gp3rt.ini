; GP3RT 1.0.1 - configuração do renderizador nativo do Grand Prix 3
; Apague linhas ou o arquivo inteiro para usar os valores padrão.
; Explicação completa no LEIAME.txt (português) / README_EN.txt (English).

[video]
; fullscreen = tela cheia sem bordas (não troca a resolução do monitor)
; window     = janela comum
mode=fullscreen
; tamanho da área da imagem no modo "window" (ela não muda de tamanho entre menu
; e corrida; a imagem se encaixa dentro). auto = 80% da tela, na proporção do
; monitor; ou um tamanho fixo, ex.: window_size=1280x720
window_size=auto
; opengl (recomendado) ou software (fallback, lento em altas resoluções)
renderer=opengl
; placa de vídeo, em PCs/notebooks com duas (Intel/AMD integrada + NVIDIA/AMD dedicada):
; auto       = usa a dedicada (respeita o que você escolheu nas Configurações do Windows)
; dedicated  = sempre a dedicada;  integrated = sempre a integrada;  system = não mexe
gpu=auto
; resolução interna do 3D: auto = 4x na placa dedicada, 2x na integrada;
; ou 1 = original, 2 = 2x (supersampling), 3, 4
internal_scale=auto
; 1 = filtragem bilinear nas texturas mesmo quando o jogo pede "point"
force_filtering=1
; filtragem anisotrópica: auto (16x na dedicada, 8x na integrada), 0, 2, 4, 8, 16
anisotropy=auto
; 1 = sincroniza com o monitor (recomendado; evita tearing e mantém o ritmo)
vsync=1
; keep = mantém proporção 4:3/5:4 com faixas pretas; stretch = estica
aspect=keep
; opacidade do spray de água e da fumaça, em % (100 = original do GP3).
; Na chuva, perto das câmeras de TV, o spray original vira uma parede cinza.
spray_opacity=60
; 1 = esmaece nuvens de spray que passam coladas na câmera (maiores que a tela)
spray_near_fade=1

; --- Widescreen ---
; Resolução widescreen. Ela SUBSTITUI a opção 1280x1024 no menu de gráficos do
; jogo (escolha "1280x1024" no menu e o jogo roda nesta resolução).
; -1 = usa a resolução da sua área de trabalho (ex.: 1920x1080)
;  0 = desligado (menu original)
; ou um tamanho fixo, ex.: wide_width=1920 / wide_height=1080 (ou 2560x1080...)
wide_width=-1
wide_height=-1
; 1 = campo de visão "Hor+": em telas largas a imagem ganha mais área dos
; lados (como seria uma TV widescreen), sem esticar e sem cortar em cima e
; embaixo. Em 4:3 e 5:4 nada muda. 0 = comportamento original do GP3
; (em tela larga ele corta o topo e a base da imagem).
hor_plus=1
; ajuste fino do campo de visão em %: 100 = padrão; 110 = mais aberto;
; 90 = mais fechado (zoom). Vale para todas as câmeras.
fov_percent=100

[game]
; 1 = cria uma unidade de CD virtual apontando para a pasta do jogo
;     (dispensa CD, ISO ou montagem; drives ópticos reais ficam ocultos ao jogo)
virtual_cd=1
; 1 = permite o DirectPlay (multiplayer em rede). 0 evita o atraso/erro na abertura
directplay=0
; 1 = GP3 1.13: protege a leitura dos arquivos de texto (ldata\*.str), que são
;     menores do que o 1.13 espera. Sem isso o jogo fecha antes do menu no
;     "Modo Debug" do GPxPatch (necessário para várias pistas da comunidade)
str_guard=1

[advanced]
; leitura preguiçosa do back buffer por proteção de página (muito mais rápido)
lazy_readback=1
; carros, sombras e spray desenhados numa camada composta pela placa de vídeo,
; sem ler a imagem de volta (grande ganho de desempenho). 0 = modo antigo
overlay_locks=1
; -1 = automático: sem truques de exceção quando há um depurador ligado ao jogo
; (o GPxPatch abre o GP3 como depurador). 1 = sempre, 0 = nunca
exception_free=-1

; 1 = ao sair, desliga o OpenGL e encerra o processo direto (evita o Gp3.exe
;     ficar preso em segundo plano com placas NVIDIA)
fast_exit=1
; 1 = ao abrir, fecha um Gp3.exe antigo que tenha ficado preso de uma
;     execução anterior (ele seguraria teclado/mouse)
close_leftover_instances=1
; 0 = devolve todos os núcleos do processador ao jogo se o GPxPatch (opção
;     CPU) o prender em um só - ESSENCIAL com placas de vídeo dedicadas.
; 1 = mantém a escolha do GPxPatch
keep_cpu_affinity=0
; 1 = em tela cheia a janela fica 1 pixel maior que o monitor (invisível),
;     para o driver NVIDIA não usar o modo "exclusivo" (Alt+Tab e Alt+Enter)
avoid_exclusive_fullscreen=1

[debug]
; 0 = só erros, 1 = informações, 2 = detalhado. Saída em gp3rt.log
log_level=1
trace_d3d=0
; 1 = Ctrl+F11 (ou Ctrl+Print Screen) salva o diagnóstico do quadro em
;     screens\frame_NNNNN (mande essa pasta ao relatar defeitos gráficos)
frame_dump=1
